name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Must match required-version in pyproject.toml, or ruff exits with an error.
      - name: Install ruff
        run: pip install ruff==0.17.2

      - name: Ruff
        run: ruff check --output-format=github

  warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest runtime the VPS is known to run; 3.14 raises the newest deprecations.
        python-version: ['3.9', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt psycopg2-binary

      - name: Smoke run with warnings as errors
        run: python -W error -X warn_default_encoding tests/smoke.py
