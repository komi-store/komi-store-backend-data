name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Must match required-version in pyproject.toml, or ruff exits with an error.
      - name: Install ruff
        run: pip install ruff==0.17.2

      - name: Ruff
        run: ruff check --output-format=github

  warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest runtime the VPS is known to run; 3.14 raises the newest deprecations.
        python-version: ['3.9', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt psycopg2-binary

      - name: Smoke run with warnings as errors
        run: python -W error -X warn_default_encoding tests/smoke.py

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # shellcheck-py puts a pinned shellcheck ahead of the runner's, so actionlint checks run: blocks the same everywhere.
      - name: Install actionlint, shellcheck and zizmor
        run: pip install actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1 zizmor==1.31.1

      - name: actionlint
        run: actionlint

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows
